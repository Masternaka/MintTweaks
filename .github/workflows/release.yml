name: Validate and release Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate source
        run: |
          make test
          make check
      - name: Plan release and stamp build version
        id: version
        run: python3 tools/release_plan.py --apply >> "$GITHUB_OUTPUT"
      - name: Check stable tag belongs to main
        if: steps.version.outputs.channel == 'stable'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install packaging tools
        if: steps.version.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper dh-python devscripts
      - name: Build package and source archive
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp "../minttweaks_${VERSION}_all.deb" dist/
          git ls-files -z | tar --null --files-from=- \
            --transform="s,^,minttweaks-${VERSION}/," \
            -czf "dist/minttweaks_${VERSION}_source.tar.gz"
          (cd dist && sha256sum ./*.deb ./*.tar.gz > SHA256SUMS)
      - name: Save release assets
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: bash tools/publish-release.sh "$CHANNEL" "$RELEASE_TAG" "$VERSION" "$GITHUB_SHA" dist
